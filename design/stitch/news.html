<body class="bg-[#fafbff] text-slate-800 antialiased font-normal selection:bg-sky-100 selection:text-sky-900 min-h-screen flex flex-col justify-between">

<!-- HEADER: Consistent with Service list page (No inquiry button / No person icon) -->
<header class="fixed top-0 left-0 w-full z-50 bg-white/95 backdrop-blur-sm border-b border-slate-100">
  <div class="h-20 max-w-[1280px] mx-auto px-6 md:px-12 flex items-center justify-between">
    <a class="flex items-center gap-2 group" data-path="philosophy" href="#">
      <span class="font-serif-jp text-2xl font-bold tracking-tight text-slate-900">OBFall</span>
      <span class="w-1.5 h-1.5 rounded-full bg-[#009fe8] mb-1"></span>
    </a>
    <nav class="hidden lg:flex items-center gap-8 font-latin font-medium text-sm tracking-[0.16em]">
      <a class="text-slate-600 hover:text-slate-900 transition-colors py-1" data-path="philosophy" href="#">PHILOSOPHY</a>
      <a class="text-slate-600 hover:text-slate-900 transition-colors py-1" data-path="service" href="#">SERVICE</a>
      <a class="text-slate-600 hover:text-slate-900 transition-colors py-1" data-path="achievements" href="#">ACHIEVEMENTS</a>
      <a class="text-slate-600 hover:text-slate-900 transition-colors py-1" data-path="about-us" href="#">ABOUT US</a>
      <a class="text-slate-600 hover:text-slate-900 transition-colors py-1" data-path="contact" href="#">CONTACT</a>
    </nav>
  </div>
</header>

<main class="w-full pt-20 flex-grow">
  <!-- PAGE TITLE BANNER: Identical to Service list & About Us pages -->
  <section class="relative w-full bg-gradient-to-r from-[#011428] via-[#022c54] to-[#014078] text-white px-6 md:px-12 py-14 overflow-hidden">
    <!-- Wing Venation Line Background Accent -->
    <div class="absolute inset-0 z-0 pointer-events-none opacity-20 flex items-center justify-end overflow-hidden">
      <svg class="w-[600px] h-[600px] text-white stroke-current transform translate-x-12 -translate-y-8" fill="none" stroke-width="0.8" viewBox="0 0 500 500">
        <path d="M50,250 C120,180 200,120 380,80 M380,80 C440,70 480,110 470,160 C460,210 390,300 280,380 C180,450 100,430 70,390 C40,350 40,280 50,250 Z"></path>
        <path d="M50,250 C150,230 280,210 450,140"></path>
        <path d="M180,225 C230,170 320,130 410,105"></path>
        <path d="M240,218 C300,260 380,280 440,230"></path>
        <path d="M150,230 C200,300 270,340 370,330"></path>
        <path d="M220,310 C280,380 340,360 410,300"></path>
      </svg>
    </div>

    <div class="max-w-[1280px] w-full mx-auto relative z-10">
      <!-- Breadcrumb -->
      <nav class="text-xs text-sky-200/80 mb-6 font-normal tracking-wider flex items-center gap-2">
        <span class="">トップ</span>
        <span class="">&gt;</span>
        <span class="text-white">最新情報</span>
      </nav>

      <!-- Section Title & Lead -->
      <div class="flex flex-col">
        <span class="font-latin text-xs tracking-[0.2em] uppercase text-sky-300 mb-1">NEWS</span>
        <h1 class="font-latin text-3xl sm:text-4xl lg:text-5xl font-normal tracking-wide text-white">News</h1>
      </div>
    </div>
  </section>

  <!-- CONTENT SECTION: News List -->
  <section class="w-full px-6 md:px-12 py-16 lg:py-24">
    <div class="max-w-[1280px] w-full mx-auto">
      
      <!-- Lead Heading with primary blue accent bar -->
      <div class="flex items-center gap-4 mb-12">
        <div class="w-1 h-8 bg-[#009fe8]"></div>
        <h2 class="font-serif-jp text-2xl sm:text-3xl text-slate-900 font-medium tracking-wide">
          最新情報一覧
        </h2>
      </div>

      <!-- Main News List Area -->
      <div class="max-w-4xl mx-auto mt-8 mb-16">
        
        <!-- Counter: Small count indication -->
        <div class="text-right text-xs sm:text-sm text-slate-500 font-normal pb-3 border-b border-slate-200">
          該当件数 : 0件
        </div>

        <!-- Quiet News Message: Top page NEWS style with subtle horizontal border, no boxes or dummy items -->
        <div class="py-16 sm:py-20 border-b border-slate-200 text-center">
          <p class="font-serif-jp text-base sm:text-lg text-slate-600 font-normal tracking-wider">
            お知らせはありません。
          </p>
        </div>

      </div>

    </div>
  </section>

        <span class="font-serif-jp text-xl font-bold tracking-tight text-slate-900">OBFall株式会社</span>
        <span class="w-1.5 h-1.5 rounded-full bg-[#009fe8] mb-0.5"></span>
      </div>
      <span class="text-xs text-slate-500 font-normal">
        〒105-0022 東京都港区海岸1-2-3 汐留芝離宮ビルディング 21F
      </span>
      <span class="font-latin text-xs text-slate-500 font-medium tracking-wider">
        TEL: 03-5403-5904
      </span>
    </div>

    <!-- Official Links & Action -->
    <div class="flex flex-wrap items-center gap-6 text-xs">
      <a class="text-slate-600 hover:text-sky-600 transition-colors" data-path="human-rights" href="#">
        人権に関する基本方針と社内相談窓口
      </a>
      <a class="inline-flex items-center gap-2 px-5 py-2.5 rounded-full bg-[#012242] hover:bg-[#023363] text-white font-medium transition-colors shadow-sm text-xs" data-path="contact" href="#"><span class="material-symbols-outlined text-[16px]">mail</span><span class="">お問い合わせはこちら</span></a>
